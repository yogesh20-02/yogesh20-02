<svg width="480" height="300" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bubble { fill: #30363d; }
    .txt { fill: #ffffff; font-size: 15px; }
    .b1 { animation: fadein 0.6s ease-in; }
    .b2 { animation: fadein 0.6s ease-in 0.5s both; }
    .b3 { animation: fadein 0.6s ease-in 1.0s both; }
    .b4 { animation: fadein 0.6s ease-in 1.5s both; }
    .b5 { animation: fadein 0.6s ease-in 2.0s both; }
    @keyframes fadein {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Bubble 1 -->
  <g class="b1">
    <rect class="bubble" x="10" y="10" width="200" height="38" rx="18"/>
    <text class="txt" x="30" y="34">Hi, I'm Yogesh 👋</text>
  </g>

  <!-- Bubble 2 -->
  <g class="b2">
    <rect class="bubble" x="10" y="58" width="320" height="62" rx="18"/>
    <text class="txt" x="30" y="82">Aspiring Software Developer</text>
    <text class="txt" x="30" y="103">Open to Work &amp;</text>
  </g>

  <!-- Bubble 3 -->
  <g class="b3">
    <rect class="bubble" x="10" y="130" width="400" height="38" rx="18"/>
    <text class="txt" x="30" y="154">Exploring AI/ML, Web Dev &amp; Cloud Computing</text>
  </g>

  <!-- Bubble 4 -->
  <g class="b4">
    <rect class="bubble" x="10" y="178" width="320" height="38" rx="18"/>
    <text class="txt" x="30" y="202">🚀 Open to Internship Opportunities</text>
  </g>

  <!-- Bubble 5 -->
  <g class="b5">
    <rect class="bubble" x="10" y="226" width="380" height="38" rx="18"/>
    <text class="txt" x="30" y="250">📫 yogesh20022007@gmail.com</text>
  </g>
</svg>
